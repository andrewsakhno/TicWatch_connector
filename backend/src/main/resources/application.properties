spring.application.name=ticwatch-cloud
# Phones find the server by scanning their /24 for this port and checking GET /api/v1/ping.
server.port=${TICWATCH_CLOUD_PORT:8766}

spring.datasource.url=${TICWATCH_DB_URL:jdbc:postgresql://localhost:5432/ticwatch}
spring.datasource.username=${TICWATCH_DB_USER:ticwatch}
spring.datasource.password=${TICWATCH_DB_PASSWORD:ticwatch}
spring.flyway.locations=classpath:db/migration

# Batch uploads of a few thousand samples.
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=32MB
server.tomcat.max-http-form-post-size=32MB

# Empty = open server (local network only). Set to require "Authorization: Bearer <key>" on /api/** except ping.
ticwatch.cloud.api-key=${TICWATCH_CLOUD_API_KEY:}
