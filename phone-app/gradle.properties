android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Build speed: incremental + cached builds ---
# Daemon heap: AGP + Kotlin compiler thrash the 512m default, forcing GC/daemon restarts.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
# Task output cache (~/.gradle/caches/build-cache-1), shared by phone-app and watch-app:
# unchanged tasks (compile, dex, merge) are restored instead of re-run, even after `clean`.
org.gradle.caching=true
# Reuses the configured task graph when build scripts are unchanged, skipping configuration.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
# Kotlin incremental compilation (ABI classpath snapshots are on by default): only recompile dependents
# whose used ABI actually changed (the "incremental linking" equivalent on the JVM side).
kotlin.incremental=true
